<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Clock + Stopwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#ffffff;
    --glow: rgba(255, 255, 255, 0.85);
    font-family: 'Cinzel Decorative', serif;
  }
  html,body{height:100%;margin:0;overflow:hidden;}
  .app{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:url("y.jpg") no-repeat center center fixed;
    background-size:cover;
    position:relative;
  }
  .app::before {
    content:'';
    position:absolute;
    inset:0;
    background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;
  }
  .display{
    position:relative;
    z-index:1;
    font-size:11vw;
    font-weight:700;
    color:var(--accent);
    text-align:center;
    line-height:1;
    letter-spacing: 6px;
    text-shadow: 0 0 12px var(--glow),
                0 0 30px rgba(255, 255, 255, 0.6),
                0 0 60px rgba(255, 255, 255, 0.3);
    animation: gothicPulse 4s infinite ease-in-out;
  }
  @keyframes gothicPulse {
    0%, 100% { opacity: 1; filter: drop-shadow(0 0 15px rgba(255,255,255,0.7)); }
    50% { opacity: 0.82; filter: drop-shadow(0 0 6px rgba(255,255,255,0.3)); }
  }
  .controls{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
    z-index:2;
  }
  button{
    background: rgba(0, 0, 0, 0.85);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.4);
    padding: 12px 18px;
    border-radius: 4px;
    font-family: 'UnifrakturMaguntia', 'Cinzel Decorative', serif;
    font-size: 1.05rem;
    letter-spacing: 1px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.9), inset 0 0 8px rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
  }
  button:hover{
    background: #ffffff;
    color: #000000;
    border-color: #ffffff;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
    transform: translateY(-2px);
  }
  :fullscreen .controls{display:none;}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="clockPanel">
    <div class="display" id="time">--:--</div>
  </div>
  <div id="stopwatchPanel" style="display:none;">
    <div class="display" id="swDisplay">00:00.00</div>
  </div>
</div>

<div class="controls">
  <button id="toggleMode">Switch to Stopwatch</button>
  <button id="swStart">Start</button>
  <button id="swReset">Reset</button>
  <button id="fullscreenBtn">Fullscreen</button>
</div>

<script>
function pad(n){return n.toString().padStart(2,'0');}
function updateClock(){
  const now=new Date();
  let hours=now.getHours()%12;
  if(hours===0) hours=12;
  document.getElementById('time').textContent=pad(hours)+':'+pad(now.getMinutes());
}
updateClock();setInterval(updateClock,1000);

/* Stopwatch */
let swRunning=false,swStart=0,swElapsed=0;
const swDisplay=document.getElementById('swDisplay');
const swStartBtn=document.getElementById('swStart');
function formatSw(ms){
  const cent=Math.floor((ms%1000)/10);
  const sec=Math.floor(ms/1000)%60;
  const min=Math.floor(ms/60000);
  return `${pad(min)}:${pad(sec)}.${pad(cent)}`;
}
function tickSw(){
  if(swRunning){
    swDisplay.textContent=formatSw(swElapsed+(Date.now()-swStart));
    requestAnimationFrame(tickSw);
  }
}
swStartBtn.onclick=()=>{
  if(!swRunning){swRunning=true;swStart=Date.now();tickSw();swStartBtn.textContent='Stop';}
  else{swRunning=false;swElapsed+=Date.now()-swStart;swStartBtn.textContent='Start';}
};
document.getElementById('swReset').onclick=()=>{swRunning=false;swElapsed=0;swDisplay.textContent='00:00.00';swStartBtn.textContent='Start';};

/* Toggle clock/stopwatch */
const toggleBtn=document.getElementById('toggleMode');
toggleBtn.onclick=()=>{
  const clock=document.getElementById('clockPanel');
  const sw=document.getElementById('stopwatchPanel');
  if(clock.style.display!=='none'){
    clock.style.display='none';
    sw.style.display='block';
    toggleBtn.textContent='Switch to Clock';
  } else {
    clock.style.display='block';
    sw.style.display='none';
    toggleBtn.textContent='Switch to Stopwatch';
  }
};

/* Fullscreen */
document.getElementById('fullscreenBtn').onclick=()=>{
  if(!document.fullscreenElement){document.documentElement.requestFullscreen();}
  else{document.exitFullscreen();}
};
</script>
</body>
</html>
