<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Clock · Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --water-light:#cfe0ee;
    --water-deep:#55688c;
    --blush:#f3cdd1;
    --rose:#d1596f;
    --ink:#201a29;
    --pearl:#fbf6f3;

    /* the clock's glow tint — swapped by .on-break to a cooler tone during rest,
       and scaled up by --glow-scale in fullscreen */
    --glow-a:rgba(243,205,209,.55);
    --glow-b:rgba(209,89,111,.28);
    --glow-c:rgba(255,255,255,.14);
    --glow-a-mid:rgba(243,205,209,.72);
    --glow-b-mid:rgba(209,89,111,.38);
    --glow-c-mid:rgba(255,255,255,.22);
    --glow-scale:1;

    /* Swap the scene any time: drop in a new data URI here, or replace
       with an external file/URL, e.g. url("your-image.jpg") */
       --bg-image: url("y.jpg")
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--ink);
  }

  .app{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background-image:var(--bg-image);
    background-repeat:no-repeat;
    background-position:center;
    background-size:cover;
    position:relative;
  }

  .app::before{
    content:'';
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 60% 46% at 50% 52%,
        rgba(32,26,41,.6) 0%,
        rgba(32,26,41,.36) 42%,
        rgba(32,26,41,.1) 70%,
        rgba(32,26,41,.02) 100%);
    pointer-events:none;
  }

  .stage{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .panel{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  #clockPanel[hidden],
  #pomodoroPanel[hidden]{ display:none; }

  .display{
    font-family:'Bodoni Moda', serif;
    font-weight:400;
    font-size:clamp(3.4rem, 13vw, 8.5rem);
    color:var(--pearl);
    letter-spacing:.07em;
    line-height:1;
    text-align:center;
    text-shadow:
      0 0 calc(18px * var(--glow-scale)) var(--glow-a),
      0 0 calc(46px * var(--glow-scale)) var(--glow-b),
      0 0 calc(92px * var(--glow-scale)) var(--glow-c);
    animation:breathe 7s ease-in-out infinite;
    transition:font-size .5s ease;
  }

  @keyframes breathe{
    0%,100%{
      filter:brightness(1);
      text-shadow:
        0 0 calc(18px * var(--glow-scale)) var(--glow-a),
        0 0 calc(46px * var(--glow-scale)) var(--glow-b),
        0 0 calc(92px * var(--glow-scale)) var(--glow-c);
    }
    50%{
      filter:brightness(1.07);
      text-shadow:
        0 0 calc(26px * var(--glow-scale)) var(--glow-a-mid),
        0 0 calc(62px * var(--glow-scale)) var(--glow-b-mid),
        0 0 calc(116px * var(--glow-scale)) var(--glow-c-mid);
    }
  }

  @keyframes settle{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.045); }
    100%{ transform:scale(1); }
  }
  .display.settle{
    animation:breathe 7s ease-in-out infinite, settle .5s ease;
  }

  /* cooler glow during the pomodoro break phase */
  .display.on-break{
    --glow-a:rgba(207,224,238,.55);
    --glow-b:rgba(85,104,140,.32);
    --glow-c:rgba(255,255,255,.14);
    --glow-a-mid:rgba(207,224,238,.72);
    --glow-b-mid:rgba(85,104,140,.42);
    --glow-c-mid:rgba(255,255,255,.22);
  }

  .caption{
    margin-top:.4em;
    font-family:'Jost', sans-serif;
    font-weight:400;
    font-size:clamp(.8rem, 1.6vw, 1.05rem);
    letter-spacing:.34em;
    color:var(--blush);
    opacity:.88;
    text-shadow:0 2px 10px rgba(20,14,26,.5);
  }

  .controls{
    position:fixed;
    bottom:clamp(22px, 5vh, 44px);
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:14px;
    z-index:2;
  }

  .icon-btn{
    width:50px;
    height:50px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(251,246,243,.08);
    border:1px solid rgba(251,246,243,.26);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:
      0 6px 22px rgba(18,13,24,.45),
      inset 0 1px 3px rgba(255,255,255,.16);
    color:var(--pearl);
    cursor:pointer;
    transition:background .3s ease, border-color .3s ease, transform .3s ease, box-shadow .3s ease;
    padding:0;
  }
  .icon-btn svg{
    width:19px;
    height:19px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .icon-btn:hover{
    background:rgba(209,89,111,.24);
    border-color:var(--blush);
    transform:translateY(-2px);
    box-shadow:
      0 10px 28px rgba(209,89,111,.32),
      inset 0 1px 4px rgba(255,255,255,.22);
  }
  .icon-btn:focus-visible{
    outline:2px solid var(--blush);
    outline-offset:3px;
  }
  .icon-btn[hidden]{ display:none; }
  .icon-btn.is-running{
    background:rgba(209,89,111,.3);
    border-color:var(--rose);
  }

  /* the button pulses more insistently while the alarm is sounding, asking to be noticed */
  .icon-btn.is-alerting{
    background:rgba(209,89,111,.42);
    border-color:var(--rose);
    animation:alertPulse 1.1s ease-in-out infinite;
  }
  @keyframes alertPulse{
    0%,100%{
      transform:scale(1);
      box-shadow:0 6px 22px rgba(18,13,24,.45), inset 0 1px 3px rgba(255,255,255,.16);
    }
    50%{
      transform:scale(1.09);
      box-shadow:0 10px 30px rgba(209,89,111,.55), inset 0 1px 4px rgba(255,255,255,.25);
    }
  }

  /* Fullscreen keeps whichever view (clock or pomodoro) was active —
     it only hides the controls and scales the display up. */
  :fullscreen .controls{ display:none; }
  :fullscreen .display{
    font-size:clamp(5.5rem, 21vw, 14rem);
    --glow-scale:1.65;
  }
  :fullscreen .caption{
    font-size:clamp(1rem, 2.2vw, 1.4rem);
  }

  @media (prefers-reduced-motion: reduce){
    .display{ animation:none; }
    .display.settle{ animation:none; }
    .icon-btn.is-alerting{ animation:none; }
  }

  @media (max-width:480px){
    .controls{ gap:10px; }
    .icon-btn{ width:44px; height:44px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="stage">
    <div id="clockPanel" class="panel">
      <div class="display" id="time">--:--</div>
      <div class="caption" id="meridiem">am</div>
    </div>
    <div id="pomodoroPanel" class="panel" hidden>
      <div class="display" id="pomDisplay">50:00</div>
      <div class="caption" id="pomPhase">focus</div>
    </div>
  </div>
</div>

<div class="controls" id="controls">
  <button class="icon-btn" id="toggleMode" type="button" title="Pomodoro" aria-label="Switch to pomodoro">
    <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
  </button>

  <button class="icon-btn" id="pomStart" type="button" title="Start" aria-label="Start focus session" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
  </button>
  <button class="icon-btn" id="pomReset" type="button" title="Reset" aria-label="Reset pomodoro" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6"/><path d="M20 15a8 8 0 10-2.7 6"/></svg>
  </button>

  <button class="icon-btn" id="fullscreenBtn" type="button" title="Fullscreen" aria-label="Enter fullscreen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 00-2 2v3"/><path d="M16 3h3a2 2 0 012 2v3"/><path d="M8 21H5a2 2 0 01-2-2v-3"/><path d="M16 21h3a2 2 0 002-2v-3"/></svg>
  </button>
</div>

<script>
(function(){
  function pad(n){ return n.toString().padStart(2,'0'); }
  var PLAY = '<path d="M8 5.5v13l11-6.5-11-6.5z"/>';
  var PAUSE = '<path d="M8 5h3v14H8z"/><path d="M13 5h3v14h-3z"/>';
  var CHECK = '<path d="M5 12.5l4.5 4.5L19 7"/>';

  /* ---------- Clock ---------- */
  var timeEl = document.getElementById('time');
  var meridiemEl = document.getElementById('meridiem');
  function updateClock(){
    var now = new Date();
    var hours = now.getHours() % 12;
    if(hours === 0) hours = 12;
    timeEl.textContent = pad(hours) + ':' + pad(now.getMinutes());
    meridiemEl.textContent = now.getHours() >= 12 ? 'pm' : 'am';
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ---------- Gentle chime, used for the phase-end alarm ---------- */
  var audioCtx = null;
  function ensureAudio(){
    try{
      if(!audioCtx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(AC) audioCtx = new AC();
      }
      if(audioCtx && audioCtx.state === 'suspended'){
        audioCtx.resume();
      }
    }catch(e){ /* Web Audio unavailable — alarm will just stay silent */ }
  }
  function playChime(){
    if(!audioCtx) return;
    var now = audioCtx.currentTime;
    [880, 1108.73].forEach(function(freq){
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.2, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 1.7);
    });
  }
  var alarmTimerId = null;
  function startAlarm(){
    if(alarmTimerId) return;
    playChime();
    alarmTimerId = setInterval(playChime, 2200);
  }
  function stopAlarm(){
    if(alarmTimerId){ clearInterval(alarmTimerId); alarmTimerId = null; }
  }

  /* ---------- Pomodoro: 50 min focus / 10 min break ---------- */
  var FOCUS_MS = 50 * 60 * 1000;
  var BREAK_MS = 10 * 60 * 1000;

  var pomDisplay = document.getElementById('pomDisplay');
  var pomPhaseEl = document.getElementById('pomPhase');
  var pomStartBtn = document.getElementById('pomStart');
  var pomResetBtn = document.getElementById('pomReset');
  var pomStartIcon = pomStartBtn.querySelector('svg');
  pomStartIcon.innerHTML = PLAY;

  var pomRunning = false;
  var pomAlerting = false;      // true while the alarm is sounding, waiting to be dismissed
  var pomPhase = 'focus';       // 'focus' | 'break'
  var pomDuration = FOCUS_MS;
  var pomStartTime = 0;
  var pomElapsed = 0;
  var pomTimerId = null;        // setInterval id for the countdown (survives backgrounded tabs better than rAF)

  function renderPomTime(remainingMs){
    var mm = Math.floor(remainingMs / 60000);
    var ss = Math.floor((remainingMs % 60000) / 1000);
    pomDisplay.textContent = pad(mm) + ':' + pad(ss);
  }
  function renderPomPhase(){
    pomPhaseEl.textContent = pomPhase;
    pomDisplay.classList.toggle('on-break', pomPhase === 'break');
  }
  pomDisplay.addEventListener('animationend', function(e){
    if(e.animationName === 'settle') pomDisplay.classList.remove('settle');
  });

  renderPomTime(pomDuration);
  renderPomPhase();

  function stopPomTicking(){
    if(pomTimerId){ clearInterval(pomTimerId); pomTimerId = null; }
  }

  function advancePomPhase(){
    if(pomPhase === 'focus'){
      pomPhase = 'break';
      pomDuration = BREAK_MS;
    } else {
      pomPhase = 'focus';
      pomDuration = FOCUS_MS;
    }
    pomElapsed = 0;
    renderPomPhase();
    renderPomTime(pomDuration);
    pomDisplay.classList.add('settle');
  }

  function enterAlertState(){
    pomAlerting = true;
    pomRunning = false;
    renderPomTime(0);
    pomPhaseEl.textContent = pomPhase + ' complete';
    pomDisplay.classList.add('settle');
    pomStartBtn.classList.remove('is-running');
    pomStartBtn.classList.add('is-alerting');
    pomStartIcon.innerHTML = CHECK;
    pomStartBtn.title = 'Stop alarm';
    pomStartBtn.setAttribute('aria-label', 'Stop alarm and start next session');
    startAlarm();
  }

  function dismissAlert(){
    pomAlerting = false;
    stopAlarm();
    pomStartBtn.classList.remove('is-alerting');
    advancePomPhase();          // move into the next phase (focus <-> break)
    pomRunning = true;          // ...and start it running immediately
    pomStartTime = Date.now();
    pomTimerId = setInterval(tickPom, 250);
    pomStartIcon.innerHTML = PAUSE;
    pomStartBtn.classList.add('is-running');
    pomStartBtn.title = 'Pause';
    pomStartBtn.setAttribute('aria-label', 'Pause timer');
  }

  function tickPom(){
    if(!pomRunning) return;
    var elapsed = pomElapsed + (Date.now() - pomStartTime);
    var remaining = pomDuration - elapsed;
    if(remaining <= 0){
      stopPomTicking();
      enterAlertState();
      return;
    }
    renderPomTime(remaining);
  }

  pomStartBtn.addEventListener('click', function(){
    ensureAudio(); // unlock audio here, on a real user gesture, so the later alarm can play unprompted
    if(pomAlerting){
      dismissAlert();
      return;
    }
    if(!pomRunning){
      pomRunning = true;
      pomStartTime = Date.now();
      pomTimerId = setInterval(tickPom, 250);
      pomStartIcon.innerHTML = PAUSE;
      pomStartBtn.classList.add('is-running');
      pomStartBtn.title = 'Pause';
      pomStartBtn.setAttribute('aria-label','Pause timer');
    } else {
      pomRunning = false;
      pomElapsed += Date.now() - pomStartTime;
      stopPomTicking();
      pomStartIcon.innerHTML = PLAY;
      pomStartBtn.classList.remove('is-running');
      pomStartBtn.title = 'Start';
      pomStartBtn.setAttribute('aria-label','Start focus session');
    }
  });

  pomResetBtn.addEventListener('click', function(){
    stopAlarm();
    pomAlerting = false;
    pomRunning = false;
    stopPomTicking();
    pomPhase = 'focus';
    pomDuration = FOCUS_MS;
    pomElapsed = 0;
    renderPomPhase();
    renderPomTime(pomDuration);
    pomStartBtn.classList.remove('is-running', 'is-alerting');
    pomStartIcon.innerHTML = PLAY;
    pomStartBtn.title = 'Start';
    pomStartBtn.setAttribute('aria-label','Start focus session');
  });

  /* ---------- Mode switching: clock <-> pomodoro ---------- */
  var clockPanel = document.getElementById('clockPanel');
  var pomPanel = document.getElementById('pomodoroPanel');
  var toggleBtn = document.getElementById('toggleMode');
  var toggleIcon = toggleBtn.querySelector('svg');

  var CLOCK_ICON = '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2.3"/>';
  var POMODORO_ICON = '<circle cx="12" cy="12" r="8.5"/><path d="M12 6.2v3.6l2.2 1.7"/><path d="M9.8 3.6c.7-.26 1.44-.4 2.2-.4"/>';

  var mode = 'clock';
  function setMode(m){
    mode = m;
    clockPanel.hidden = (m !== 'clock');
    pomPanel.hidden = (m !== 'pomodoro');
    pomStartBtn.hidden = (m !== 'pomodoro');
    pomResetBtn.hidden = (m !== 'pomodoro');

    var dest = m === 'clock' ? 'pomodoro' : 'clock';
    toggleIcon.innerHTML = m === 'clock' ? POMODORO_ICON : CLOCK_ICON;
    toggleBtn.title = dest.charAt(0).toUpperCase() + dest.slice(1);
    toggleBtn.setAttribute('aria-label', 'Switch to ' + dest);
  }
  toggleIcon.innerHTML = POMODORO_ICON;
  toggleBtn.addEventListener('click', function(){ setMode(mode === 'clock' ? 'pomodoro' : 'clock'); });

  /* ---------- Fullscreen ---------- */
  /* Keeps whatever view is currently active (clock or pomodoro) — just
     hides the control bar and scales the display up via CSS above. */
  var fsBtn = document.getElementById('fullscreenBtn');
  fsBtn.addEventListener('click', function(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });
})();
</script>
</body>
</html>
