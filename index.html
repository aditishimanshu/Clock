    background:var(--ink);
  }

  .app{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background-image:var(--bg-image);
    background-repeat:no-repeat;
    background-position:center;
    background-size:cover;
    position:relative;
  }

  .app::before{
    content:'';
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 60% 46% at 50% 52%,
        rgba(32,26,41,.6) 0%,
        rgba(32,26,41,.36) 42%,
        rgba(32,26,41,.1) 70%,
        rgba(32,26,41,.02) 100%);
    pointer-events:none;
  }

  .stage{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .panel{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .display{
    font-family:'Bodoni Moda', serif;
    font-weight:400;
    font-size:clamp(3.4rem, 13vw, 8.5rem);
    color:var(--pearl);
    letter-spacing:.07em;
    line-height:1;
    text-align:center;
    text-shadow:
      0 0 18px rgba(243,205,209,.55),
      0 0 46px rgba(209,89,111,.28),
      0 0 92px rgba(255,255,255,.14);
    animation:breathe 7s ease-in-out infinite;
    transition:font-size .5s ease;
  }

  @keyframes breathe{
    0%,100%{
      filter:brightness(1);
      text-shadow:
        0 0 18px rgba(243,205,209,.55),
        0 0 46px rgba(209,89,111,.28),
        0 0 92px rgba(255,255,255,.14);
    }
    50%{
      filter:brightness(1.07);
      text-shadow:
        0 0 26px rgba(243,205,209,.72),
        0 0 62px rgba(209,89,111,.38),
        0 0 116px rgba(255,255,255,.22);
    }
  }

  .meridiem{
    margin-top:.4em;
    font-family:'Jost', sans-serif;
    font-weight:400;
    font-size:clamp(.8rem, 1.6vw, 1.05rem);
    letter-spacing:.34em;
    color:var(--blush);
    opacity:.88;
    text-shadow:0 2px 10px rgba(20,14,26,.5);
  }

  #stopwatchPanel[hidden],
  #clockPanel[hidden]{ display:none; }

  .controls{
    position:fixed;
    bottom:clamp(22px, 5vh, 44px);
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:14px;
    z-index:2;
  }

  .icon-btn{
    width:50px;
    height:50px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(251,246,243,.08);
    border:1px solid rgba(251,246,243,.26);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:
      0 6px 22px rgba(18,13,24,.45),
      inset 0 1px 3px rgba(255,255,255,.16);
    color:var(--pearl);
    cursor:pointer;
    transition:background .3s ease, border-color .3s ease, transform .3s ease, box-shadow .3s ease;
    padding:0;
  }
  .icon-btn svg{
    width:19px;
    height:19px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .icon-btn:hover{
    background:rgba(209,89,111,.24);
    border-color:var(--blush);
    transform:translateY(-2px);
    box-shadow:
      0 10px 28px rgba(209,89,111,.32),
      inset 0 1px 4px rgba(255,255,255,.22);
  }
  .icon-btn:focus-visible{
    outline:2px solid var(--blush);
    outline-offset:3px;
  }
  .icon-btn[hidden]{ display:none; }

  #swStart.is-running{
    background:rgba(209,89,111,.3);
    border-color:var(--rose);
  }

  :fullscreen .controls{ display:none; }
  :fullscreen .display{
    font-size:clamp(5.5rem, 21vw, 14rem);
    text-shadow:
      0 0 30px rgba(243,205,209,.78),
      0 0 74px rgba(209,89,111,.46),
      0 0 150px rgba(255,255,255,.26);
  }
  :fullscreen .meridiem{
    font-size:clamp(1rem, 2.2vw, 1.4rem);
  }

  @media (prefers-reduced-motion: reduce){
    .display{ animation:none; }
  }

  @media (max-width:480px){
    .controls{ gap:10px; }
    .icon-btn{ width:44px; height:44px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="stage">
    <div id="clockPanel" class="panel">
      <div class="display" id="time">--:--</div>
      <div class="meridiem" id="meridiem">am</div>
    </div>
    <div id="stopwatchPanel" class="panel" hidden>
      <div class="display" id="swDisplay">00:00.00</div>
    </div>
  </div>
</div>

<div class="controls" id="controls">
  <button class="icon-btn" id="toggleMode" type="button" title="Stopwatch" aria-label="Switch to stopwatch">
    <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
  </button>
  <button class="icon-btn" id="swStart" type="button" title="Start" aria-label="Start stopwatch" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
  </button>
  <button class="icon-btn" id="swReset" type="button" title="Reset" aria-label="Reset stopwatch" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6"/><path d="M20 15a8 8 0 10-2.7 6"/></svg>
  </button>
  <button class="icon-btn" id="fullscreenBtn" type="button" title="Fullscreen" aria-label="Enter fullscreen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 00-2 2v3"/><path d="M16 3h3a2 2 0 012 2v3"/><path d="M8 21H5a2 2 0 01-2-2v-3"/><path d="M16 21h3a2 2 0 002-2v-3"/></svg>
  </button>
</div>

<script>
(function(){
  function pad(n){ return n.toString().padStart(2,'0'); }

  /* ---------- Clock ---------- */
  var timeEl = document.getElementById('time');
  var meridiemEl = document.getElementById('meridiem');
  function updateClock(){
    var now = new Date();
    var hours = now.getHours() % 12;
    if(hours === 0) hours = 12;
    timeEl.textContent = pad(hours) + ':' + pad(now.getMinutes());
    meridiemEl.textContent = now.getHours() >= 12 ? 'pm' : 'am';
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ---------- Stopwatch ---------- */
  var swRunning = false, swStartTime = 0, swElapsed = 0, swRAF = null;
  var swDisplay = document.getElementById('swDisplay');
  var swStartBtn = document.getElementById('swStart');
  var swResetBtn = document.getElementById('swReset');
  var startIcon = swStartBtn.querySelector('svg');
  var PLAY = '<path d="M8 5.5v13l11-6.5-11-6.5z"/>';
  var PAUSE = '<path d="M8 5h3v14H8z"/><path d="M13 5h3v14h-3z"/>';
  startIcon.innerHTML = PLAY;

  function formatSw(ms){
    var cent = Math.floor((ms % 1000) / 10);
    var sec = Math.floor(ms / 1000) % 60;
    var min = Math.floor(ms / 60000);
    return pad(min) + ':' + pad(sec) + '.' + pad(cent);
  }
  function tickSw(){
    if(swRunning){
      swDisplay.textContent = formatSw(swElapsed + (Date.now() - swStartTime));
      swRAF = requestAnimationFrame(tickSw);
    }
  }
  swStartBtn.addEventListener('click', function(){
    if(!swRunning){
      swRunning = true;
      swStartTime = Date.now();
      tickSw();
      startIcon.innerHTML = PAUSE;
      swStartBtn.classList.add('is-running');
      swStartBtn.title = 'Pause';
      swStartBtn.setAttribute('aria-label','Pause stopwatch');
    } else {
      swRunning = false;
      swElapsed += Date.now() - swStartTime;
      cancelAnimationFrame(swRAF);
      startIcon.innerHTML = PLAY;
      swStartBtn.classList.remove('is-running');
      swStartBtn.title = 'Start';
      swStartBtn.setAttribute('aria-label','Start stopwatch');
    }
  });
  swResetBtn.addEventListener('click', function(){
    swRunning = false;
    swElapsed = 0;
    cancelAnimationFrame(swRAF);
    swDisplay.textContent = '00:00.00';
    startIcon.innerHTML = PLAY;
    swStartBtn.classList.remove('is-running');
    swStartBtn.title = 'Start';
    swStartBtn.setAttribute('aria-label','Start stopwatch');
  });

  /* ---------- Clock / stopwatch toggle ---------- */
  var clockPanel = document.getElementById('clockPanel');
  var swPanel = document.getElementById('stopwatchPanel');
  var toggleBtn = document.getElementById('toggleMode');
  var toggleIcon = toggleBtn.querySelector('svg');
  var STOPWATCH_ICON = '<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V10"/><path d="M9.5 2h5"/><path d="M12 2v2.2"/><path d="M18.5 7l1.2-1.2"/>';
  var CLOCK_ICON = '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2.3"/>';
  toggleIcon.innerHTML = STOPWATCH_ICON;

  var inStopwatch = false;
  function setStopwatchVisible(show){
    inStopwatch = show;
    clockPanel.hidden = show;
    swPanel.hidden = !show;
    swStartBtn.hidden = !show;
    swResetBtn.hidden = !show;
    toggleIcon.innerHTML = show ? CLOCK_ICON : STOPWATCH_ICON;
    toggleBtn.title = show ? 'Clock' : 'Stopwatch';
    toggleBtn.setAttribute('aria-label', show ? 'Switch to clock' : 'Switch to stopwatch');
  }
  toggleBtn.addEventListener('click', function(){ setStopwatchVisible(!inStopwatch); });

  /* ---------- Fullscreen (clock-only, per your earlier preference) ---------- */
  var fsBtn = document.getElementById('fullscreenBtn');
  var preFullscreenStopwatch = false;
  fsBtn.addEventListener('click', function(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', function(){
    if(document.fullscreenElement){
      preFullscreenStopwatch = inStopwatch;
      setStopwatchVisible(false);
    } else {
      setStopwatchVisible(preFullscreenStopwatch);
    }
  });
})();
</script>
</body>
</html>
