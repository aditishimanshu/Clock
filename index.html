<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Clock + Stopwatch + Spotify</title>
<style>
  :root{
    --accent:#d6006f;
    font-family: Inter, system-ui, sans-serif;
  }
  html,body{height:100%;margin:0;}
  .app{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:url("y.jpg") no-repeat center center fixed;
    background-size:cover;
  }
  .display{
    font-size:12vw;
    font-weight:700;
    color:var(--accent);
    text-align:center;
    line-height:1;
    text-shadow:0 0 20px rgba(214,0,111,0.8),
               0 0 40px rgba(214,0,111,0.6);
  }
  .controls{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
  }
  button{
    background:var(--accent);
    color:white;
    border:0;
    padding:10px 14px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
  }
  :fullscreen .controls{display:none;}
  .spotify{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:8px;
    align-items:flex-end;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div id="clockPanel">
    <div class="display" id="time">--:--</div>
  </div>
  <div id="stopwatchPanel" style="display:none;">
    <div class="display" id="swDisplay">00:00.00</div>
  </div>
</div>

<div class="controls">
  <button id="toggleMode">Switch to Stopwatch</button>
  <button id="swStart">Start</button>
  <button id="swReset">Reset</button>
  <button id="fullscreenBtn">Fullscreen</button>
  <button id="loginBtn">Login with Spotify</button>
</div>

<div class="spotify">
  <!-- Spotify Player Embed -->
  <iframe id="spotifyFrame" style="border-radius:12px" 
    src="https://open.spotify.com/embed/album/2Jc0evKv7asNZMx32rQHrF?utm_source=generator" 
    width="300" height="80" frameBorder="0" 
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
    loading="lazy"></iframe>
</div>

<script>
function pad(n){return n.toString().padStart(2,'0');}
function updateClock(){
  const now=new Date();
  document.getElementById('time').textContent=
    pad(now.getHours())+':'+pad(now.getMinutes());
}
updateClock();setInterval(updateClock,1000);

/* Stopwatch */
let swRunning=false,swStart=0,swElapsed=0;
const swDisplay=document.getElementById('swDisplay');
const swStartBtn=document.getElementById('swStart');
function formatSw(ms){
  const cent=Math.floor((ms%1000)/10);
  const sec=Math.floor(ms/1000)%60;
  const min=Math.floor(ms/60000);
  return `${pad(min)}:${pad(sec)}.${pad(cent)}`;
}
function tickSw(){
  if(swRunning){
    swDisplay.textContent=formatSw(swElapsed+(Date.now()-swStart));
    requestAnimationFrame(tickSw);
  }
}
swStartBtn.onclick=()=>{
  if(!swRunning){swRunning=true;swStart=Date.now();tickSw();swStartBtn.textContent='Stop';}
  else{swRunning=false;swElapsed+=Date.now()-swStart;swStartBtn.textContent='Start';}
};
document.getElementById('swReset').onclick=()=>{
  swRunning=false;swElapsed=0;
  swDisplay.textContent='00:00.00';
  swStartBtn.textContent='Start';
};

/* Toggle clock/stopwatch */
const toggleBtn=document.getElementById('toggleMode');
toggleBtn.onclick=()=>{
  const clock=document.getElementById('clockPanel');
  const sw=document.getElementById('stopwatchPanel');
  if(clock.style.display!=='none'){
    clock.style.display='none';
    sw.style.display='block';
    toggleBtn.textContent='Switch to Clock';
  } else {
    clock.style.display='block';
    sw.style.display='none';
    toggleBtn.textContent='Switch to Stopwatch';
  }
};

/* Fullscreen */
document.getElementById('fullscreenBtn').onclick=()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
};

/* Spotify Login */
const clientId = "87e4d3bdd8ec4c069d7e54557d291292"; 
const redirectUri = "https://aditishimanshu.github.io/Clock/callback.html"; 
const scopes = [
  "streaming",
  "user-read-email",
  "user-read-private",
  "user-read-playback-state",
  "user-modify-playback-state"
];

document.getElementById("loginBtn").onclick = () => {
  const authUrl = `https://accounts.spotify.com/authorize?client_id=${clientId}&response_type=token&redirect_uri=${encodeURIComponent(redirectUri)}&scope=${scopes.join("%20")}`;
  window.location.href = authUrl;
};

/* Read token from localStorage (after callback) */
const token = localStorage.getItem("spotify_token");
if (token) {
  console.log("Spotify token available:", token);
  // Here you can initialize Web Playback SDK or make API calls
}
</script>
</body>
</html>
