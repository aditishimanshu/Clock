<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spotify Callback</title>
</head>
<body>
<script>
// Extract authorization code from the URL
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

if (code) {
  // Save the code temporarily in localStorage
  localStorage.setItem("spotify_code", code);

  // Redirect back to your main page
  window.location.href = "/Clock/index.html";
} else {
  document.body.innerHTML = "<p>No code found. Please log in again.</p>";
}
</script>
</body>
</html>
